name: Update scorecard

on:
  schedule:
    - cron: "0 17 * * 5"   # every Friday 19:00 South African time, after the JSE close
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - "index.html"
  workflow_dispatch: {}      # "Run workflow" button on the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scorecard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices and build data.json
        run: |
          pip install yfinance pandas
          python scripts/build_data.py

      - name: Save data.json to the repository
        run: |
          git config user.name "scorecard-bot"
          git config user.email "scorecard-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update prices"
          git push

      - name: Prepare site
        run: |
          mkdir _site
          cp index.html data.json _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
