name: Diag dividends
on:
  push:
    branches: [total-return]
    paths: [".github/workflows/diag.yml"]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: pip install yfinance pandas
      - run: |
          python - <<'PY'
          import yfinance as yf
          for t in ["FSR.JO","SBK.JO","NPN.JO","ANH.JO"]:
              tk=yf.Ticker(t)
              dv=tk.dividends
              print(t,"DIVIDENDS:",dv.tail(4).to_dict())
              h=yf.download(t,start="2024-01-01",auto_adjust=False,actions=True,progress=False)
              r=(h["Adj Close"]/h["Close"]).iloc[:,0]
              print(t,"adj/close first,last:",float(r.iloc[0]),float(r.iloc[-1]),"close last",float(h["Close"].iloc[-1,0]))
              if "Dividends" in h: d=h["Dividends"].iloc[:,0]; print(t,"download divs:",d[d>0].tail(4).to_dict())
          PY
